name: Keep Supabase Active

on:
  schedule:
    - cron: "0 8 */3 * *" # Setiap 3 hari pukul 15:00 WIB
  workflow_dispatch: # Bisa dijalankan manual lewat tab Actions di GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://serviceiphonebandung.vercel.app/api/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            exit 1
          fi